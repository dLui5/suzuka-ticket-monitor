name: Ticket monitor

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Restore alert history
        id: restore
        run: python3 github_state.py restore
      - name: Check tickets
        if: steps.restore.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: '2026-11-25'
          TICKET_QUANTITY: '2'
        run: python3 monitor.py
      - name: Save alert history
        if: always() && steps.restore.outcome == 'success'
        run: python3 github_state.py save
